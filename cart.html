
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopping Cart | MAYORIX AGRO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="siteHeader"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow">Your selection</p>
        <h1>Review your cart.</h1>
        <p>Adjust your quantities before adding your delivery or collection details.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div id="cartContents" aria-live="polite"></div>
        <div class="cart-actions">
          <a href="products.html" class="btn btn-outline">← Continue shopping</a>
          <a href="delivery.html" class="btn btn-primary">Continue to delivery →</a>
        </div>
        <p class="form-note">The cart is saved in this browser. It is not yet synced to an online customer account.</p>
      </div>
    </section>
  </main>

  <div id="siteFooter"></div>
  <script src="script.js"></script>
</body>
</html>
